[project]
name = "floatcli"
version = "0.1.0"
description = "Diagnostic CLI for the Floatplane and FloatNative Companion APIs. Mirrors what the iOS/Android apps send so that schema drift, decode failures, and auth bugs can be reproduced from a terminal."
requires-python = ">=3.11"
authors = [{ name = "Coulter Peterson" }]
readme = "README.md"
license = { file = "../../LICENSE" }
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "cryptography>=42.0",
    "jsonschema>=4.22",
    "platformdirs>=4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
floatcli = "floatcli.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["floatcli"]

[tool.ruff]
line-length = 100
target-version = "py311"
